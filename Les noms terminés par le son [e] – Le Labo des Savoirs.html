<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les noms terminés par le son [e] – Le Labo des Savoirs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2a44;--brand:#5b3fd1;--m:#2f6fdb;--f:#d6458f;--gen:#1f9d6b;--par:#ef8a1c;--ok:#1f9d6b;--ko:#e04848;--line:#d9e0f2}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Lexend','Segoe UI',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#eef2ff,#fff6ee);font-size:clamp(18px,1.55vw,28px);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:18px;padding:8px 22px;background:#fff;border-bottom:4px solid var(--brand);flex-wrap:wrap}
.logo{height:76px;width:auto;display:block}
.logo-fallback{height:58px;display:flex;align-items:center;padding:0 18px;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;letter-spacing:.02em}
.tabs{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.tab{font:inherit;font-size:.72em;font-weight:600;border:2px solid var(--line);background:#fff;border-radius:999px;padding:.45em 1em;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff}
.fs{font:inherit;font-size:.7em;border:2px solid var(--line);background:#fff;border-radius:12px;padding:.4em .8em;cursor:pointer}
.dots{display:flex;gap:8px;justify-content:center;padding:8px;background:#ffffffaa;min-height:34px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--line);border:0;cursor:pointer;padding:0}
.dot.on{background:var(--brand);transform:scale(1.35)}
main{flex:1;overflow:auto;padding:18px 28px 0}
.stage{max-width:1500px;margin:0 auto;padding-bottom:20px}
h1{font-size:1.9em;margin:.1em 0 .2em}
h2{font-size:1.45em;margin:.1em 0 .3em;color:var(--brand)}
.consigne{background:#fff;border-left:10px solid var(--brand);border-radius:12px;padding:.6em 1em;margin:.4em 0 .9em;box-shadow:0 2px 6px #0001}
.consigne b{color:var(--brand)}
.think{font-weight:600;font-size:1.05em}
.chip{display:inline-block;padding:.3em .85em;border-radius:999px;background:#fff;border:3px solid var(--line);font-weight:600;cursor:pointer;margin:.25em;box-shadow:0 3px 0 var(--line);user-select:none;transition:transform .1s}
.chip:hover{transform:translateY(-2px)}
.chip.sel{outline:5px solid var(--brand);background:#efeaff}
.chip.ok{background:#dff6ea;border-color:var(--ok);cursor:default}
.chip.ko{background:#ffe3e3;border-color:var(--ko);cursor:default}
.tag{font-size:.7em;font-weight:800;color:var(--ko);margin-left:.3em}
.g{font-size:.8em;font-weight:800;margin-left:.3em}.g.gm{color:var(--m)}.g.gf{color:var(--f)}
.end{background:#ffe08a;border-radius:6px;padding:0 .08em;font-weight:800}
.pool{min-height:80px;background:#ffffffaa;border:3px dashed var(--line);border-radius:18px;padding:8px;margin-bottom:14px}
.pool small{display:block;opacity:.65;font-size:.65em;padding:2px 8px}
.buckets{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:14px}
.bucket{min-height:170px;border:3px dashed var(--c);border-radius:18px;background:#fff;padding:8px;cursor:pointer}
.bucket h3{margin:0 0 6px;text-align:center;border-radius:10px;padding:.25em;color:#fff;background:var(--c);font-size:.95em}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:14px}
.item{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 14px}
.item.ok{border-color:var(--ok);background:#effaf4}.item.ko{border-color:var(--ko);background:#fff0f0}
.num{display:inline-block;width:1.6em;height:1.6em;line-height:1.6em;text-align:center;border-radius:50%;background:var(--brand);color:#fff;font-size:.7em;font-weight:800;margin-right:.5em}
.line{font-size:1.25em;font-weight:600;min-height:1.7em}
.blank{display:inline-block;min-width:2em;border-bottom:4px solid var(--brand);text-align:center;color:var(--brand);font-weight:800;margin:0 .1em}
.note{font-size:.75em;margin-top:.4em;color:#44506b}
.bar{position:sticky;bottom:0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fffffff2;border-top:3px solid var(--line);padding:10px 4px;margin-top:16px}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:.55em 1.2em;cursor:pointer}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 0 #3b2790}
.btn.ghost{background:#fff;border:3px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.fb{font-weight:800;font-size:1.1em}
.rule{border-left:12px solid;border-radius:14px;padding:12px 18px;margin:12px 0;background:#fff;animation:pop .4s;font-size:1.1em}
.rule.gen{border-color:var(--gen);background:#effaf4}.rule.par{border-color:var(--par);background:#fff4e6}.rule.tease{border-color:var(--brand);background:#f1edff}
.badge{display:inline-block;padding:.1em .75em;border-radius:99px;color:#fff;font-size:.7em;font-weight:800;margin-right:.6em;vertical-align:middle}
.badge.gen{background:var(--gen)}.badge.par{background:var(--par)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
select,input.fx,textarea{font:inherit;border:3px solid var(--brand);border-radius:10px;background:#fff;padding:.1em .3em;color:var(--ink)}
select.ok,input.fx.ok{border-color:var(--ok);background:#dff6ea}select.ko,input.fx.ko{border-color:var(--ko);background:#ffe3e3}
textarea{width:100%;min-height:200px;padding:.6em;font-size:1em}
.wordcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.wc{background:#fff;border:3px solid var(--line);border-radius:16px;padding:14px;text-align:center;font-size:1.3em;font-weight:600}
.wc .sp{font-size:.7em;margin-left:.4em;border:0;background:#eef;border-radius:50%;width:2em;height:2em;cursor:pointer}
.wc .hid{margin-top:.5em;font-size:.8em}
.home{text-align:center;padding-top:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin:22px 0}
.card{background:#fff;border-radius:20px;padding:18px;border:4px solid var(--brand);cursor:pointer;text-align:left;box-shadow:0 6px 0 #5b3fd133;transition:transform .15s}
.card:hover{transform:translateY(-4px)}
.card h3{margin:0 0 .3em;color:var(--brand)}.card p{margin:0;font-size:.8em}
.legend{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.poster{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1000px){.poster{grid-template-columns:1fr}.buckets{grid-template-columns:repeat(2,1fr)}}
.poster .col{border-radius:18px;padding:14px 18px}
.poster .gen{background:#effaf4;border:4px solid var(--gen)}.poster .par{background:#fff4e6;border:4px solid var(--par)}
.poster h3{margin:.1em 0 .5em}.poster .r{background:#fff;border-radius:12px;padding:10px 14px;margin:10px 0}
.astuce{background:#f1edff;border:4px solid var(--brand);border-radius:18px;padding:12px 20px;margin-top:18px}
.astuce ol{margin:.3em 0;padding-left:1.4em}
footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 22px;background:#fff;border-top:4px solid var(--brand)}
footer .mid{font-size:.75em;font-weight:600;text-align:center;flex:1}
.crit{margin:.3em 0;font-weight:600}
</style>
</head>

<script>
/* ---------- utilitaires ---------- */
const $=(s,e=document)=>e.querySelector(s);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function nounOf(t){return t.replace(/^(un |une |la |le |l’|l')/,'')}
function endOf(n){if(n==='pâté')return 'é';const m=n.match(/(tée|tié|té|ée|er|é)$/);return m?m[1]:''}
function hl(t){const n=nounOf(t),e=endOf(n);if(!e)return t;const det=t.slice(0,t.length-n.length);return det+n.slice(0,n.length-e.length)+'<b class="end">'+e+'</b>'}
function gOf(t){return /^un /.test(t)?'m':'f'}
const mk=(list,b)=>list.map(t=>({t,b}));

const LOGO_SRC=$('#logo').src;
/* ---------- logo (fallback) ---------- */
$('#logo').onerror=function(){const d=el('div','logo-fallback','🔬 Le Labo des Savoirs');this.replaceWith(d)};
$('#fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})};

/* ---------- vocabulaire ---------- */
const L={
 mE:['un marché','un café','un bébé','un pâté','un fossé','un carré'],
 mR:['un boulanger','un jardinier','un panier','un cahier','un escalier','un rocher'],
 mX:['un musée','un lycée','un trophée','un scarabée','un mausolée'],
 fE:['une poupée','une année','une journée','une vallée','une arrivée','une soirée','une pensée'],
 fT:['la liberté','la beauté','la qualité','la propreté','l’amitié','la moitié','la pitié','une activité'],
 fX:['une dictée','une montée','une jetée','une portée','une pâtée','une pelletée','une assiettée','une brouettée']
};
const CAT={mE:'mgen',mR:'mgen',mX:'exc',fE:'fee',fT:'fte',fX:'exc'};
const LOOK={};Object.keys(L).forEach(k=>L[k].forEach(t=>LOOK[nounOf(t)]=CAT[k]));

/* ---------- composants ---------- */
function consigne(root,html){root.append(el('div','consigne',html))}

function bar(root,o){
  const b=el('div','bar'),v=el('button','btn primary','Valider ✔'),r=el('button','btn ghost','↺ Recommencer'),fb=el('div','fb');
  b.append(v,r,fb);root.append(b);
  v.onclick=()=>{const res=o.validate();if(res.warn){fb.style.color='var(--ko)';fb.textContent='⚠ '+res.warn;return}
    const p=res.score/res.total;fb.style.color=p===1?'var(--ok)':p>=.7?'var(--brand)':'var(--ko)';
    fb.textContent=(p===1?'🎉 Parfait ! ':p>=.7?'👍 Bien joué ! ':'💪 Regardons la correction ensemble : ')+res.score+' / '+res.total;v.disabled=true};
  r.onclick=()=>{o.reset();fb.textContent='';v.disabled=false};
}

/* tri par colonnes */
function sortAct(root,cfg){
  const wrap=el('div');root.append(wrap);
  let st,sel,locked,order,drag;
  function init(){st=new Map();cfg.words.forEach(w=>st.set(w,-1));order=shuffle(cfg.words);sel=null;locked=false;draw()}
  function chip(w){
    const c=el('div','chip'+(sel===w?' sel':''));
    if(locked){const ok=st.get(w)===w.b;c.classList.add(ok?'ok':'ko');c.innerHTML=hl(w.t);
      if(cfg.genre)c.innerHTML+=`<span class="g g${'m'===gOf(w.t)?'m':'f'}">${gOf(w.t)==='m'?'♂':'♀'}</span>`;
      if(!ok)c.innerHTML+=`<span class="tag">→ ${cfg.buckets[w.b].label}</span>`}
    else{c.textContent=w.t;c.draggable=true;
      c.ondragstart=e=>{drag=w;e.dataTransfer.setData('text/plain',w.t)};
      c.onclick=ev=>{ev.stopPropagation();if(st.get(w)>=0){st.set(w,-1);sel=null}else sel=(sel===w?null:w);draw()}}
    return c}
  function draw(){
    wrap.innerHTML='';
    const pool=el('div','pool');
    if(!locked){pool.append(el('small','', 'Clique sur un mot puis sur sa colonne (ou glisse-le). Reclique sur un mot placé pour le reprendre.'))}
    order.filter(w=>st.get(w)<0).forEach(w=>pool.append(chip(w)));
    pool.ondragover=e=>e.preventDefault();pool.ondrop=e=>{e.preventDefault();if(drag&&!locked){st.set(drag,-1);draw()}};
    wrap.append(pool);
    const g=el('div','buckets');g.style.setProperty('--n',cfg.buckets.length);
    cfg.buckets.forEach((bk,i)=>{
      const d=el('div','bucket');d.style.setProperty('--c',bk.color);d.append(el('h3','',bk.label));
      order.filter(w=>st.get(w)===i).forEach(w=>d.append(chip(w)));
      d.onclick=()=>{if(sel&&!locked){st.set(sel,i);sel=null;draw()}};
      d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();if(drag&&!locked){st.set(drag,i);draw()}};
      g.append(d)});
    wrap.append(g)}
  init();
  bar(root,{validate(){if(cfg.words.some(w=>st.get(w)<0))return{warn:'Place tous les mots avant de valider.'};
      locked=true;draw();return{score:cfg.words.filter(w=>st.get(w)===w.b).length,total:cfg.words.length}},reset:init});
}

/* trous à choisir / choix d'orthographe */
function pickAct(root,items,cols){
  const wrap=el('div','items');if(cols)wrap.style.gridTemplateColumns=`repeat(auto-fill,minmax(${cols}px,1fr))`;root.append(wrap);
  let val,locked;
  function init(){val=items.map(()=>null);locked=false;draw()}
  function draw(){
    wrap.innerHTML='';
    items.forEach((it,i)=>{
      const ok=val[i]===it.ans,d=el('div','item'+(locked?(ok?' ok':' ko'):''));
      let line;
      if(it.blank){const shown=locked?(ok?`<b class="end">${it.ans}</b>`:`<s>${val[i]??'…'}</s> <b class="end">${it.ans}</b>`):(val[i]??'___');
        line=`${it.pre}<span class="blank">${shown}</span>${it.post||''}`}
      else if(it.choose){line=locked?hl(it.ans)+(ok?' ✓':` <span class="tag">(tu as choisi : <s>${val[i]??'…'}</s>)</span>`):'&nbsp;'}
      else{line=it.pre+(locked&&!ok?` <span class="tag">→ ${it.ans}</span>`:locked?' ✓':'')}
      d.append(el('div','line',`<span class="num">${i+1}</span>${line}`));
      const row=el('div');
      it.opts.forEach(o=>{const c=el('span','chip'+(val[i]===o?' sel':''),o);
        if(!locked)c.onclick=()=>{val[i]=o;draw()};row.append(c)});
      d.append(row);
      if(locked&&it.note)d.append(el('div','note','💡 '+it.note));
      wrap.append(d)})}
  init();
  bar(root,{validate(){if(val.some(v=>v===null))return{warn:'Il reste des réponses à donner.'};
      locked=true;draw();return{score:items.filter((it,i)=>val[i]===it.ans).length,total:items.length}},reset:init});
}

/* phrases à trous (menus déroulants) */
function gapAct(root,sents){
  const wrap=el('div');root.append(wrap);let locked;
  const sels=[];
  function build(){
    wrap.innerHTML='';sels.length=0;locked=false;
    sents.forEach((s,si)=>{
      const d=el('div','rule '+s.kind);
      d.append(el('span','badge '+s.kind,s.kind==='gen'?'Règle générale':'Cas particulier'));
      const sp=el('span');
      s.t.split(/(\{\d+\})/).forEach(part=>{
        const m=part.match(/^\{(\d+)\}$/);
        if(!m){sp.append(document.createRange().createContextualFragment(part));return}
        const g=s.g[+m[1]],sl=el('select');sl.append(new Option('…',''));g.o.forEach(o=>sl.append(new Option(o,o)));
        sels.push({sl,g,s,sp});sp.append(sl)});
      d.append(sp);wrap.append(d)})}
  build();
  bar(root,{validate(){
      if(sels.some(x=>!x.sl.value))return{warn:'Complète tous les menus avant de valider.'};
      const used={};let sc=0;
      sels.forEach(x=>{let ok=x.g.a.includes(x.sl.value);
        if(ok&&x.g.grp){const k=x.s.t+x.g.grp;used[k]=used[k]||[];if(used[k].includes(x.sl.value))ok=false;else used[k].push(x.sl.value)}
        x.sl.className=ok?'ok':'ko';x.sl.disabled=true;if(ok)sc++;
        else x.sl.insertAdjacentHTML('afterend',` <span class="tag">→ ${x.g.a.join(' / ')}</span>`)});
      return{score:sc,total:sels.length}},reset:build});
}

/* correction de texte */
function fixAct(root,tpl,wrongs,answers){
  const wrap=el('div','rule tease');root.append(wrap);let inputs;
  function build(){
    wrap.innerHTML='';inputs=[];const sp=el('div','line');sp.style.lineHeight='2.2';
    tpl.split(/(\{\d+\})/).forEach(part=>{const m=part.match(/^\{(\d+)\}$/);
      if(!m){sp.append(document.createTextNode(part));return}
      const i=+m[1],inp=el('input','fx');inp.value=wrongs[i];inp.style.width=(wrongs[i].length+3)+'ch';inp.spellcheck=false;inputs.push(inp);sp.append(inp)});
    wrap.append(sp)}
  build();
  bar(root,{validate(){let sc=0;
      inputs.forEach((inp,i)=>{const ok=inp.value.trim().toLowerCase()===answers[i];inp.className='fx '+(ok?'ok':'ko');inp.disabled=true;if(ok)sc++;
        else inp.insertAdjacentHTML('afterend',` <span class="tag">→ ${answers[i]}</span>`)});
      return{score:sc,total:answers.length}},reset:build});
}

/* règles révélées une à une */
function ruleAct(root,intro,rules,label){
  if(intro)root.append(el('p','think',intro));
  const box=el('div');root.append(box);let i=0;
  const btn=el('button','btn primary',label||'👀 Révéler la règle');root.append(btn);
  btn.onclick=()=>{const r=rules[i++];
    const d=el('div','rule '+r.kind,(r.kind==='gen'||r.kind==='par'?`<span class="badge ${r.kind}">${r.kind==='gen'?'Règle générale':'Cas particulier'}</span>`:'')+r.html);
    box.append(d);d.scrollIntoView({behavior:'smooth',block:'nearest'});
    if(i>=rules.length)btn.remove();else btn.textContent='👀 Suite…'};
}

step(4,'Exercice 3 · La bonne orthographe',r=>{

  const P=[['la libertée','la liberté'],['une dicté','une dictée'],['un musé','un musée'],['une anné','une année'],['l’amitiée','l’amitié'],['un boulanger','un boulangé'],['une moitiée','une moitié'],['un trophé','un trophée'],['une valée','une vallée'],['la beautée','la beauté']];
  const ans=['la liberté','une dictée','un musée','une année','l’amitié','un boulanger','une moitié','un trophée','une vallée','la beauté'];
  pickAct(r,P.map((o,i)=>({choose:true,opts:o,ans:ans[i]})),340);
});

step(4,'Exercice 4 · -té, -tié ou -tée',r=>{
  consigne(r,'<b>Exercice 4.</b> Complète avec <b>-té</b>, <b>-tié</b> ou <b>-tée</b>. Attention aux cas particuliers !');
  const o=['té','tié','tée'];
  pickAct(r,[['la beau','té'],['l’ami','tié'],['la quali','té'],['la moi','tié'],['la liber','té'],['la dic','tée'],['la mon','tée'],['la por','tée'],['une pelle','tée'],['une assiet','tée']]
    .map(([pre,ans])=>({pre,blank:true,opts:o,ans})),340);
});

step(4,'Exercice 5 · Corrige le texte',r=>{
  consigne(r,'<b>Exercice 5.</b> Ce texte contient <b>six mots mal orthographiés</b>. Corrige-les directement dans les cases.');
  fixAct(r,'Pour la {0} de la {1}, notre classe prépare une {2}. Un {3} vient présenter son métier. Il apporte un {4} et parle de la {5} de son travail.',
    ['journé','libertée','activitée','boulangé','trophé','beautée'],['journée','liberté','activité','boulanger','trophée','beauté']);
});

step(4,'Cartes de tri',r=>{
  consigne(r,'<b>Atelier de tri.</b> Classe chaque carte dans sa famille. Puis explique le choix de <b>deux cartes</b> à ton voisin.');
  const f=[['Masculins -é',['un marché','un bébé','un fossé']],['Masculins -er',['un boulanger','un escalier','un rocher']],['🟠 Masculins -ée',['un musée','un trophée','un mausolée']],
           ['Féminins -ée',['une poupée','une vallée','une arrivée']],['Féminins -té / -tié',['la beauté','l’amitié','la pitié']],['🟠 Féminins -tée',['une dictée','une jetée','une pelletée']]];
  const w=[];f.forEach(([,l],i)=>w.push(...mk(l,i)));
  sortAct(r,{words:w,buckets:f.map(([label],i)=>({label,color:col[i]}))});
});

step(4,'Production écrite',r=>{
  consigne(r,'<b>Exercice 6 · Production écrite.</b> Écris <b>trois phrases</b> avec au moins <b>six noms</b> terminés par le son [e] : un masculin en -é/-er, un féminin en -ée, un féminin en -té/-tié et une exception.');
  const ta=el('textarea');ta.placeholder='Écris ici tes trois phrases…';r.append(ta);
  const out=el('div');r.append(out);
  const b=el('div','bar'),v=el('button','btn primary','🔍 Vérifier mon texte');b.append(v);r.append(b);
  const names={mgen:'masculin en -é / -er',fee:'féminin en -ée',fte:'féminin en -té / -tié',exc:'cas particulier (masc. -ée ou fém. -tée)'};
  v.onclick=()=>{
    const toks=[...new Set((ta.value.toLowerCase().match(/[a-zàâäéèêëîïôöùûüç]+/g)||[]))].filter(t=>LOOK[t]);
    const by={mgen:[],fee:[],fte:[],exc:[]};toks.forEach(t=>by[LOOK[t]].push(t));
    let h=`<div class="rule tease"><b>Noms reconnus : ${toks.length}</b> / 6 minimum<div>`;
    toks.forEach(t=>h+=`<span class="chip ok">${t}</span>`);h+='</div>';
    Object.keys(names).forEach(k=>h+=`<div class="crit">${by[k].length?'✅':'⬜'} ${names[k]}</div>`);
    h+=`<div class="note">La vérification reconnaît seulement les mots de la leçon, bien écrits. Ton enseignant relit tes phrases.</div></div>`;
    out.innerHTML=h};
});

/* ---------- navigation ---------- */
let idx=0;
function render(){
  const s=STEPS[idx],st=$('#stage');st.innerHTML='';
  if(idx>0)st.append(el('h2','',`${SECS[s.sec].split('·')[0].trim()} · ${s.title}`));
  s.render(st);
  $('#tabs').innerHTML='';
  SECS.forEach((n,i)=>{const t=el('button','tab'+(i===s.sec?' on':''),n);t.onclick=()=>goto(STEPS.findIndex(x=>x.sec===i));$('#tabs').append(t)});
  $('#dots').innerHTML='';
  STEPS.forEach((x,i)=>{if(x.sec===s.sec&&s.sec>0){const d=el('button','dot'+(i===idx?' on':''));d.title=x.title;d.onclick=()=>goto(i);$('#dots').append(d)}});
  $('#mid').textContent=idx===0?'Choisis une séance ou clique sur « Suivant »':SECS[s.sec]+' — '+s.title;
  $('#prev').disabled=idx===0;$('#next').disabled=idx===STEPS.length-1;
  $('main').scrollTop=0;history.replaceState(null,'','#'+idx);
}
function goto(i){idx=Math.max(0,Math.min(STEPS.length-1,i));render()}
$('#prev').onclick=()=>goto(idx-1);$('#next').onclick=()=>goto(idx+1);
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight')goto(idx+1);if(e.key==='ArrowLeft')goto(idx-1)});
idx=Math.min(STEPS.length-1,parseInt(location.hash.slice(1))||0);render();
</script>
